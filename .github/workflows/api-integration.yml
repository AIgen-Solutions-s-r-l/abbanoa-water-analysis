name: API Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-int:
    runs-on: ubuntu-latest

    env:
      API_BASE: http://localhost:8000/api/v1
      USE_MOCK_API: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry --version
          poetry install --no-interaction --no-root
          poetry run pip install httpx

      - name: Launch API (background)
        env:
          PYTHONPATH: ${{ github.workspace }}
          USE_MOCK_API: ${{ env.USE_MOCK_API }}
        run: |
          nohup poetry run uvicorn presentation.api.app_postgres:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -sfL http://localhost:8000/health || (echo 'API failed to start' && exit 1)

      - name: Run API integration tests (isolated)
        env:
          PYTHONPATH: ${{ github.workspace }}
          API_BASE: ${{ env.API_BASE }}
        run: |
          poetry run pytest -q -p no:conftest tests/integration/test_dashboard_anomalies_int.py



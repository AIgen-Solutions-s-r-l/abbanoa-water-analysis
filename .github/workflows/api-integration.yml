name: API Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-int:
    runs-on: ubuntu-latest

    env:
      API_BASE: http://localhost:8000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry --version
          poetry install --no-interaction --no-root
          poetry run pip install httpx

      - name: Launch API (background)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # API will run with mocked database connections for testing
          nohup poetry run uvicorn src.presentation.api.app_postgres:app --host 0.0.0.0 --port 8000 &
          sleep 5
          # Health check may fail due to database dependency - this is expected
          curl -sfL http://localhost:8000/health || echo 'API health check failed (expected without DB)'

      - name: Run API integration tests (isolated)
        env:
          PYTHONPATH: ${{ github.workspace }}
          API_BASE: ${{ env.API_BASE }}
        run: |
          poetry run pytest -q -p no:conftest tests/integration/test_dashboard_anomalies_int.py



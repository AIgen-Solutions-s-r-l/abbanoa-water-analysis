name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run type checking
        working-directory: ./frontend
        run: npm run type-check
      
      - name: Run linting
        working-directory: ./frontend
        run: npm run lint
      
      - name: Run unit tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage:ci
        env:
          CI: true
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true
      
      - name: Check coverage thresholds
        working-directory: ./frontend
        run: |
          echo "Checking coverage thresholds..."
          npm run test:coverage -- --coverageReporters=json-summary
          
          # Extract coverage percentages
          LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          BRANCHES=$(jq '.total.branches.pct' coverage/coverage-summary.json)
          FUNCTIONS=$(jq '.total.functions.pct' coverage/coverage-summary.json)
          STATEMENTS=$(jq '.total.statements.pct' coverage/coverage-summary.json)
          
          echo "Coverage Summary:"
          echo "Lines: $LINES%"
          echo "Branches: $BRANCHES%"
          echo "Functions: $FUNCTIONS%"
          echo "Statements: $STATEMENTS%"
          
          # Check against thresholds (TODO: Gradually increase these)
          # Target thresholds: lines: 90, branches: 80, functions: 90, statements: 90
          THRESHOLD_LINES=15
          THRESHOLD_BRANCHES=10
          THRESHOLD_FUNCTIONS=10
          THRESHOLD_STATEMENTS=15
          
          if (( $(echo "$LINES < $THRESHOLD_LINES" | bc -l) )); then
            echo "❌ Line coverage ($LINES%) is below threshold ($THRESHOLD_LINES%)"
            exit 1
          fi
          
          if (( $(echo "$BRANCHES < $THRESHOLD_BRANCHES" | bc -l) )); then
            echo "❌ Branch coverage ($BRANCHES%) is below threshold ($THRESHOLD_BRANCHES%)"
            exit 1
          fi
          
          if (( $(echo "$FUNCTIONS < $THRESHOLD_FUNCTIONS" | bc -l) )); then
            echo "❌ Function coverage ($FUNCTIONS%) is below threshold ($THRESHOLD_FUNCTIONS%)"
            exit 1
          fi
          
          if (( $(echo "$STATEMENTS < $THRESHOLD_STATEMENTS" | bc -l) )); then
            echo "❌ Statement coverage ($STATEMENTS%) is below threshold ($THRESHOLD_STATEMENTS%)"
            exit 1
          fi
          
          echo "✅ All coverage thresholds met!"
      
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            frontend/coverage/
            frontend/junit.xml
          retention-days: 30
      
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./frontend/coverage/coverage-summary.json', 'utf8'));
            
            const comment = `## 📊 Frontend Test Coverage Report
            
            | Type | Coverage | Current Threshold | Target Threshold |
            |------|----------|-------------------|------------------|
            | Lines | ${coverage.total.lines.pct}% | 15% | 90% |
            | Branches | ${coverage.total.branches.pct}% | 10% | 80% |
            | Functions | ${coverage.total.functions.pct}% | 10% | 90% |
            | Statements | ${coverage.total.statements.pct}% | 15% | 90% |
            
            ${
              coverage.total.lines.pct >= 15 &&
              coverage.total.branches.pct >= 10 &&
              coverage.total.functions.pct >= 10 &&
              coverage.total.statements.pct >= 15
                ? '✅ All current coverage thresholds met!'
                : '❌ Some coverage thresholds not met!'
            }
            
            **Note:** Coverage thresholds will be gradually increased as more tests are added.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 7
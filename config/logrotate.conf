# Log rotation configuration for scheduled jobs
/root/abbanoa-water-analysis/logs/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    copytruncate
    create 644 root root
    
    postrotate
        # Send SIGHUP to any processes that might need to reopen log files
        # This is optional since most Python logging handles rotation gracefully
        /bin/true
    endscript
}
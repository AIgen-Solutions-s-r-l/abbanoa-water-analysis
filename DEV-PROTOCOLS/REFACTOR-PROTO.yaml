context:
  task: "Systematic code refactoring for maintainability and performance"
  trigger: "File exceeds complexity thresholds or scheduled refactoring sprint"

protocol:
  analysisMetrics:
    complexity:
      cyclomaticThreshold: 10
      cognitiveThreshold: 15
      nestingDepthMax: 4
    
    fileMetrics:
      linesOfCode:
        warning: 300
        critical: 500
      classSize:
        warning: 20  # methods
        critical: 30
      methodLength:
        warning: 50  # lines
        critical: 100
    
    codeSmells:
      duplications:
        threshold: "3+ similar blocks > 10 lines"
        action: "Extract to shared function/module"
      
      longParameterList:
        threshold: "> 4 parameters"
        action: "Use parameter object or builder pattern"
      
      featureEnvy:
        detection: "Method uses more external data than own"
        action: "Move to appropriate class/module"
      
      dataClumps:
        detection: "Same parameters repeatedly passed together"
        action: "Group into value object"

  refactoringPatterns:
    extract:
      - method: "When method > 50 lines"
      - class: "When class > 500 lines"
      - module: "When file > 1000 lines"
      - interface: "When multiple clients use subset of methods"
    
    inline:
      - method: "When method adds no value"
      - variable: "When used once and doesn't clarify"
    
    move:
      - method: "To class that uses it most"
      - field: "To class that accesses it most"
    
    rename:
      - trigger: "Name doesn't express intent"
      - convention: "Use domain language"
    
    simplify:
      - conditionals: "Replace nested if with guard clauses"
      - loops: "Use functional approaches where clearer"
      - expressions: "Extract complex calculations"

taskPlan:
  goal: "Improve code quality without changing behavior"
  
  tasks:
    - id: 1.1
      description: "Run static analysis to identify refactoring targets"
      commands:
        - "poetry run radon cc src/ -s -nb"  # Cyclomatic complexity
        - "poetry run radon mi src/ -s"      # Maintainability index
        - "npx eslint . --format json > eslint-report.json"
      status: "pending"
    
    - id: 1.2
      description: "Create refactoring branch"
      command: "git checkout -b refactor/{scope}-{date}"
      status: "pending"
    
    - id: 1.3
      description: "Snapshot current behavior with characterization tests"
      actions:
        - "Identify untested code paths"
        - "Write tests that document current behavior"
        - "Achieve 100% coverage on refactoring targets"
      status: "pending"
    
    - id: 1.4
      description: "Apply refactoring patterns incrementally"
      loop: "For each identified smell"
      steps:
        - "Make smallest possible change"
        - "Run tests to verify behavior unchanged"
        - "Commit with descriptive message"
      status: "pending"
    
    - id: 1.5
      description: "Optimize performance if applicable"
      checks:
        - "Profile before and after"
        - "Document performance improvements"
        - "Add performance tests"
      status: "pending"
    
    - id: 1.6
      description: "Update documentation"
      updates:
        - "API documentation"
        - "Architecture diagrams"
        - "README if interfaces changed"
      status: "pending"

refactoringCatalog:
  backend_python:
    extractMethod:
      before: |
        def process_data(data):
            # validation
            if not data:
                raise ValueError()
            if data.get('status') != 'active':
                return None
            
            # transformation
            result = {}
            for key, value in data.items():
                if key.startswith('metric_'):
                    result[key[7:]] = value * 1.5
            
            # persistence
            db.save(result)
            cache.set(f"data_{data['id']}", result)
            
            return result
      
      after: |
        def process_data(data):
            validated_data = _validate_data(data)
            if not validated_data:
                return None
            
            transformed_data = _transform_metrics(validated_data)
            _persist_data(transformed_data, data['id'])
            
            return transformed_data
        
        def _validate_data(data):
            if not data:
                raise ValueError()
            if data.get('status') != 'active':
                return None
            return data
        
        def _transform_metrics(data):
            result = {}
            for key, value in data.items():
                if key.startswith('metric_'):
                    result[key[7:]] = value * 1.5
            return result
        
        def _persist_data(data, data_id):
            db.save(data)
            cache.set(f"data_{data_id}", data)
    
    replaceConditionalWithPolymorphism:
      before: |
        def calculate_price(product_type, base_price):
            if product_type == 'standard':
                return base_price
            elif product_type == 'premium':
                return base_price * 1.2
            elif product_type == 'deluxe':
                return base_price * 1.5 + 100
            else:
                raise ValueError(f"Unknown type: {product_type}")
      
      after: |
        from abc import ABC, abstractmethod
        
        class PricingStrategy(ABC):
            @abstractmethod
            def calculate(self, base_price: float) -> float:
                pass
        
        class StandardPricing(PricingStrategy):
            def calculate(self, base_price: float) -> float:
                return base_price
        
        class PremiumPricing(PricingStrategy):
            def calculate(self, base_price: float) -> float:
                return base_price * 1.2
        
        class DeluxePricing(PricingStrategy):
            def calculate(self, base_price: float) -> float:
                return base_price * 1.5 + 100
        
        PRICING_STRATEGIES = {
            'standard': StandardPricing(),
            'premium': PremiumPricing(),
            'deluxe': DeluxePricing(),
        }
        
        def calculate_price(product_type: str, base_price: float) -> float:
            strategy = PRICING_STRATEGIES.get(product_type)
            if not strategy:
                raise ValueError(f"Unknown type: {product_type}")
            return strategy.calculate(base_price)

  frontend_react:
    extractComponent:
      before: |
        function Dashboard() {
          const [data, setData] = useState([]);
          const [filter, setFilter] = useState('all');
          
          return (
            <div>
              <div className="header">
                <h1>Dashboard</h1>
                <select value={filter} onChange={e => setFilter(e.target.value)}>
                  <option value="all">All</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
              
              <div className="metrics">
                <div className="metric-card">
                  <h3>Total</h3>
                  <p>{data.length}</p>
                </div>
                <div className="metric-card">
                  <h3>Active</h3>
                  <p>{data.filter(d => d.active).length}</p>
                </div>
                <div className="metric-card">
                  <h3>Inactive</h3>
                  <p>{data.filter(d => !d.active).length}</p>
                </div>
              </div>
              
              <table>
                {/* table content */}
              </table>
            </div>
          );
        }
      
      after: |
        function Dashboard() {
          const [data, setData] = useState([]);
          const [filter, setFilter] = useState('all');
          
          return (
            <div>
              <DashboardHeader filter={filter} onFilterChange={setFilter} />
              <MetricsPanel data={data} />
              <DataTable data={data} filter={filter} />
            </div>
          );
        }
        
        function DashboardHeader({ filter, onFilterChange }) {
          return (
            <div className="header">
              <h1>Dashboard</h1>
              <FilterSelect value={filter} onChange={onFilterChange} />
            </div>
          );
        }
        
        function MetricsPanel({ data }) {
          const metrics = calculateMetrics(data);
          
          return (
            <div className="metrics">
              {Object.entries(metrics).map(([label, value]) => (
                <MetricCard key={label} label={label} value={value} />
              ))}
            </div>
          );
        }
        
        function MetricCard({ label, value }) {
          return (
            <div className="metric-card">
              <h3>{label}</h3>
              <p>{value}</p>
            </div>
          );
        }

validation:
  preRefactoring:
    - "Full test suite passes"
    - "Performance baseline recorded"
    - "Code coverage > 80%"
    - "No pending changes"
  
  duringRefactoring:
    - "Tests pass after each change"
    - "No behavior changes"
    - "Commits are atomic"
    - "Each commit message explains why"
  
  postRefactoring:
    - "All tests still pass"
    - "Performance same or better"
    - "Complexity metrics improved"
    - "Documentation updated"
    - "No TODO/FIXME added"

metrics:
  before:
    collect:
      - "Cyclomatic complexity"
      - "Lines of code"
      - "Test coverage"
      - "Performance benchmarks"
      - "Bundle size (frontend)"
  
  after:
    compare:
      - "Complexity reduced by X%"
      - "Code duplication eliminated"
      - "Test coverage maintained/improved"
      - "Performance impact documented"
      - "Bundle size impact"
  
  report:
    location: "docs/refactoring/{date}-{scope}.md"
    include:
      - "Metrics comparison table"
      - "Patterns applied"
      - "Lessons learned"
      - "Future recommendations"
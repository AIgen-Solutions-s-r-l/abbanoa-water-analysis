context:
  task: "Comprehensive security audit and vulnerability assessment"
  frequency: "Weekly automated, Monthly manual, Quarterly penetration test"
  compliance: ["OWASP Top 10", "CWE Top 25", "GDPR", "ISO 27001"]

protocol:
  securityLayers:
    application:
      staticAnalysis:
        - tool: "bandit"
          command: "poetry run bandit -r src/ -ll -i -f json"
          threshold: "No high/critical issues"
        
        - tool: "semgrep"
          command: "semgrep --config=auto src/"
          rulesets: ["security", "secrets", "sql-injection"]
        
        - tool: "eslint-security"
          command: "npx eslint --plugin security frontend/"
          focus: ["XSS", "Injection", "Unsafe regex"]
      
      dependencyScanning:
        - tool: "safety"
          command: "poetry run safety check --json"
          action: "Block on critical CVEs"
        
        - tool: "npm audit"
          command: "cd frontend && npm audit --json"
          severity: "Block on high/critical"
        
        - tool: "snyk"
          command: "snyk test --severity-threshold=high"
          monitor: "Continuous vulnerability DB updates"
      
      secretsDetection:
        - tool: "trufflescan"
          patterns:
            - "API keys"
            - "Database credentials"
            - "JWT secrets"
            - "Private keys"
          action: "Block commit if detected"
        
        - tool: "git-secrets"
          command: "git secrets --scan"
          preCommitHook: true
    
    infrastructure:
      containerScanning:
        - tool: "trivy"
          command: "trivy image --severity HIGH,CRITICAL {image}"
          frequency: "On build and daily"
        
        - tool: "docker bench"
          command: "docker run --rm docker/docker-bench-security"
          checks: "CIS Docker Benchmark"
      
      networkSecurity:
        - portScanning:
            tool: "nmap"
            command: "nmap -sV -sC -A -p- {target}"
            expected: "Only required ports open"
        
        - tlsValidation:
            tool: "testssl"
            command: "testssl.sh --severity HIGH {domain}"
            requirements:
              - "TLS 1.2+ only"
              - "Strong ciphers"
              - "Valid certificates"
      
      cloudSecurity:
        - tool: "prowler"
          command: "prowler -g cis_level2"
          provider: "GCP"
          checks: ["IAM", "Storage", "Network", "Logging"]

  vulnerabilityCategories:
    injection:
      types: ["SQL", "NoSQL", "OS Command", "LDAP", "XPath"]
      prevention:
        - "Parameterized queries"
        - "Input validation"
        - "Escape special characters"
        - "Least privilege principle"
      testing:
        - "SQLMap for SQL injection"
        - "Fuzzing with special characters"
        - "Time-based blind injection tests"
    
    authentication:
      checks:
        - "Multi-factor authentication"
        - "Password complexity requirements"
        - "Session management"
        - "Account lockout mechanisms"
      tools:
        - "hydra for brute force testing"
        - "jwt_tool for JWT vulnerabilities"
    
    xss:
      types: ["Reflected", "Stored", "DOM-based"]
      prevention:
        - "Content Security Policy"
        - "Input sanitization"
        - "Output encoding"
        - "HTTPOnly cookies"
      testing:
        - "XSStrike automated scanner"
        - "Manual payload testing"
        - "Browser security headers check"
    
    exposure:
      checks:
        - "Sensitive data encryption"
        - "Error message verbosity"
        - "Debug mode disabled"
        - "Directory listing disabled"
        - "Backup files not accessible"
    
    accessControl:
      verification:
        - "RBAC implementation"
        - "API rate limiting"
        - "Resource authorization"
        - "CORS policy"
      testing:
        - "Privilege escalation attempts"
        - "IDOR vulnerabilities"
        - "JWT manipulation"

taskPlan:
  goal: "Identify and remediate security vulnerabilities"
  
  tasks:
    - id: 1.1
      description: "Run automated security scanners"
      parallel: true
      tools:
        - "SAST (Static Application Security Testing)"
        - "Dependency vulnerability scanning"
        - "Container security scanning"
      status: "pending"
    
    - id: 1.2
      description: "Perform manual security review"
      focus:
        - "Authentication flows"
        - "Authorization logic"
        - "Data validation"
        - "Cryptographic implementations"
      status: "pending"
    
    - id: 1.3
      description: "Execute penetration testing"
      scope:
        - "API endpoints"
        - "Frontend application"
        - "Infrastructure"
      status: "pending"
    
    - id: 1.4
      description: "Review security configurations"
      checks:
        - "Database security settings"
        - "API security headers"
        - "CORS configuration"
        - "TLS/SSL settings"
      status: "pending"
    
    - id: 1.5
      description: "Generate security report"
      sections:
        - "Executive summary"
        - "Vulnerabilities by severity"
        - "Remediation plan"
        - "Compliance status"
      status: "pending"

remediationPriority:
  P0_Critical:
    examples:
      - "SQL injection in production"
      - "Authentication bypass"
      - "Exposed credentials"
      - "Remote code execution"
    sla: "Fix within 4 hours"
    action: "Hotfix deployment"
  
  P1_High:
    examples:
      - "XSS vulnerabilities"
      - "Weak encryption"
      - "Missing authorization checks"
    sla: "Fix within 24 hours"
    action: "Priority patch"
  
  P2_Medium:
    examples:
      - "Information disclosure"
      - "Missing security headers"
      - "Outdated dependencies"
    sla: "Fix within 1 week"
    action: "Next release"
  
  P3_Low:
    examples:
      - "Verbose error messages"
      - "Missing rate limiting"
      - "Weak password policy"
    sla: "Fix within 1 month"
    action: "Backlog"

securityTesting:
  unit:
    focus: "Input validation and sanitization"
    examples:
      - "Test SQL injection prevention"
      - "Test XSS filtering"
      - "Test authentication logic"
  
  integration:
    focus: "Security between components"
    examples:
      - "Test API authorization"
      - "Test session management"
      - "Test CORS policy"
  
  penetration:
    blackBox:
      - "No source code access"
      - "Simulate external attacker"
      - "Focus on exposed services"
    
    whiteBox:
      - "Full source code access"
      - "Comprehensive testing"
      - "Code review included"
    
    grayBox:
      - "Limited information"
      - "User-level access"
      - "Realistic scenarios"

compliance:
  gdpr:
    requirements:
      - "Data encryption at rest and in transit"
      - "Right to be forgotten implementation"
      - "Consent management"
      - "Data breach notification (72 hours)"
    
    audit:
      - "Data inventory maintained"
      - "Privacy policy updated"
      - "Data retention policies"
      - "Third-party processor agreements"
  
  owasp:
    top10_2021:
      A01: "Broken Access Control"
      A02: "Cryptographic Failures"
      A03: "Injection"
      A04: "Insecure Design"
      A05: "Security Misconfiguration"
      A06: "Vulnerable Components"
      A07: "Authentication Failures"
      A08: "Data Integrity Failures"
      A09: "Logging Failures"
      A10: "Server-Side Request Forgery"
    
    verification:
      - "Each category tested"
      - "Mitigations implemented"
      - "Regular reassessment"

monitoring:
  realtime:
    - tool: "SIEM integration"
      alerts:
        - "Multiple failed login attempts"
        - "SQL injection attempts"
        - "Unusual API usage patterns"
        - "Privilege escalation attempts"
    
    - tool: "WAF (Web Application Firewall)"
      rules:
        - "Block known attack patterns"
        - "Rate limiting per IP"
        - "Geo-blocking if needed"
    
    - tool: "IDS/IPS"
      detection:
        - "Anomaly detection"
        - "Signature-based detection"
        - "Behavioral analysis"
  
  logging:
    required:
      - "Authentication events"
      - "Authorization failures"
      - "Data access/modifications"
      - "System configuration changes"
    
    format:
      - "Structured JSON logs"
      - "Include correlation IDs"
      - "Timestamp with timezone"
      - "User identification"
    
    retention:
      security: "90 days minimum"
      compliance: "As per regulations"
      storage: "Encrypted and tamper-proof"

incidentResponse:
  phases:
    1_detection:
      - "Automated alerts"
      - "User reports"
      - "Monitoring systems"
    
    2_containment:
      - "Isolate affected systems"
      - "Preserve evidence"
      - "Prevent spread"
    
    3_eradication:
      - "Remove threat"
      - "Patch vulnerabilities"
      - "Update signatures"
    
    4_recovery:
      - "Restore services"
      - "Verify integrity"
      - "Monitor closely"
    
    5_lessons:
      - "Post-incident review"
      - "Update procedures"
      - "Training needs"
      - "Tool improvements"

report:
  format: "docs/security/audit-{date}.md"
  sections:
    executive:
      - "Overall security posture"
      - "Critical findings"
      - "Recommended actions"
    
    technical:
      - "Detailed vulnerability list"
      - "CVSS scores"
      - "Proof of concept"
      - "Remediation steps"
    
    compliance:
      - "Standards adherence"
      - "Gap analysis"
      - "Roadmap to compliance"
    
    metrics:
      - "Vulnerabilities by category"
      - "Risk score trending"
      - "Time to remediation"
      - "Coverage percentage"
      - "Uptime percentage"
      - "Health check status"
      - "Circuit breaker state"
    
    performance:
      - "Request latency (p50, p95, p99)"
      - "Throughput (req/s)"
      - "Error rate"
      - "Response size"
    
    usage:
      - "Endpoints hit frequency"
      - "User/client statistics"
      - "Rate limit violations"
      - "Authentication failures"
  
  logging:
    structured: |
      {
        "timestamp": "2024-01-01T12:00:00Z",
        "level": "INFO",
        "method": "POST",
        "path": "/api/v1/users",
        "status": 201,
        "duration_ms": 45,
        "client_ip": "192.168.1.1",
        "user_id": "user_123",
        "request_id": "req_abc123",
        "user_agent": "MyApp/1.0"
      }
  
  alerts:
    - condition: "Error rate > 5%"
      severity: "HIGH"
      action: "Page on-call"
    
    - condition: "p95 latency > 1s"
      severity: "MEDIUM"
      action: "Slack notification"
    
    - condition: "Rate limit violations > 100/min"
      severity: "LOW"
      action: "Email alert"
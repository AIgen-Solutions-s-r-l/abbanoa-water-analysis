context:
  task: "Performance optimization and bottleneck elimination"
  trigger: "Performance degradation, user complaints, or scheduled optimization"
  targets:
    api_response: "< 200ms p95"
    database_query: "< 100ms p95"
    frontend_load: "< 3s FCP, < 5s TTI"
    throughput: "> 1000 req/s"

protocol:
  performanceMetrics:
    backend:
      latency:
        p50: "< 50ms"
        p95: "< 200ms"
        p99: "< 500ms"
      
      throughput:
        minimum: "500 req/s"
        target: "1000 req/s"
        peak: "2000 req/s"
      
      resources:
        cpu: "< 70% average"
        memory: "< 80% utilized"
        connections: "< 80% pool"
    
    frontend:
      coreWebVitals:
        LCP: "< 2.5s"  # Largest Contentful Paint
        FID: "< 100ms" # First Input Delay
        CLS: "< 0.1"   # Cumulative Layout Shift
      
      lighthouse:
        performance: "> 90"
        accessibility: "> 95"
        bestPractices: "> 95"
        seo: "> 95"
      
      bundleSize:
        initial: "< 200KB"
        lazy: "< 50KB per chunk"
        total: "< 1MB compressed"
    
    database:
      queryPerformance:
        simple: "< 10ms"
        complex: "< 100ms"
        aggregation: "< 500ms"
      
      indexing:
        coverage: "> 95% of queries"
        efficiency: "No full table scans"
        maintenance: "Weekly ANALYZE"
      
      connections:
        poolSize: "Optimized for load"
        idleTimeout: "300s"
        maxLifetime: "1800s"

  profilingTools:
    backend:
      python:
        - tool: "cProfile"
          command: "python -m cProfile -o profile.stats src/app.py"
          analysis: "snakeviz profile.stats"
        
        - tool: "py-spy"
          command: "py-spy record -o profile.svg -- python src/app.py"
          realtime: "py-spy top -- python src/app.py"
        
        - tool: "memory_profiler"
          command: "mprof run python src/app.py && mprof plot"
          decorator: "@profile for line-by-line"
        
        - tool: "line_profiler"
          command: "kernprof -l -v src/app.py"
          focus: "Hot code paths"
    
    frontend:
      javascript:
        - tool: "Chrome DevTools"
          panels: ["Performance", "Memory", "Network"]
          recording: "User interactions and load"
        
        - tool: "React DevTools Profiler"
          focus: "Component render times"
          identify: "Unnecessary re-renders"
        
        - tool: "webpack-bundle-analyzer"
          command: "npm run build -- --analyze"
          optimize: "Identify large dependencies"
        
        - tool: "Lighthouse CI"
          command: "lhci autorun"
          budgets: "Performance budgets in config"
    
    database:
      postgresql:
        - tool: "EXPLAIN ANALYZE"
          usage: "EXPLAIN (ANALYZE, BUFFERS) SELECT ..."
          focus: "Query plan and execution"
        
        - tool: "pg_stat_statements"
          enable: "CREATE EXTENSION pg_stat_statements"
          query: "SELECT * FROM pg_stat_statements ORDER BY total_time DESC"
        
        - tool: "pgBadger"
          command: "pgbadger /var/log/postgresql/*.log"
          report: "HTML report with insights"
        
        - tool: "auto_explain"
          config: "auto_explain.log_min_duration = '100ms'"
          capture: "Slow queries automatically"

  optimizationPatterns:
    caching:
      levels:
        - browser: "Cache-Control headers"
        - cdn: "Static assets and API responses"
        - application: "Redis for session and data"
        - database: "Query result caching"
      
      strategies:
        - pattern: "Cache-aside"
          useCase: "Read-heavy workloads"
          ttl: "Based on data volatility"
        
        - pattern: "Write-through"
          useCase: "Consistent cache"
          overhead: "Write latency"
        
        - pattern: "Write-behind"
          useCase: "Write optimization"
          risk: "Data loss on failure"
    
    database:
      queryOptimization:
        - "Add missing indexes"
        - "Denormalize hot paths"
        - "Partition large tables"
        - "Use materialized views"
        - "Batch operations"
      
      connectionPooling:
        - "PgBouncer for PostgreSQL"
        - "Optimal pool size formula"
        - "Connection lifecycle management"
      
      readReplicas:
        - "Separate read/write loads"
        - "Load balancing strategy"
        - "Replication lag monitoring"
    
    api:
      techniques:
        - pagination: "Cursor-based for large datasets"
        - filtering: "Server-side with indexes"
        - projection: "Return only needed fields"
        - compression: "gzip/brotli responses"
        - http2: "Multiplexing and server push"
      
      async:
        - "FastAPI async endpoints"
        - "Background task queues"
        - "WebSocket for real-time"
        - "Event-driven architecture"
    
    frontend:
      rendering:
        - "Code splitting by route"
        - "Lazy loading components"
        - "Virtual scrolling for lists"
        - "Memoization with React.memo"
        - "useMemo/useCallback hooks"
      
      assets:
        - "Image optimization (WebP, AVIF)"
        - "Responsive images with srcset"
        - "Font subsetting"
        - "Critical CSS inlining"
        - "Resource hints (preload, prefetch)"

taskPlan:
  goal: "Identify and eliminate performance bottlenecks"
  
  tasks:
    - id: 1.1
      description: "Establish performance baseline"
      metrics:
        - "Current response times"
        - "Resource utilization"
        - "User experience scores"
      tools: ["APM", "Synthetic monitoring", "RUM"]
      status: "pending"
    
    - id: 1.2
      description: "Profile application under load"
      steps:
        - "Generate realistic load with k6/JMeter"
        - "Profile CPU and memory"
        - "Identify hot paths"
      status: "pending"
    
    - id: 1.3
      description: "Analyze database performance"
      checks:
        - "Slow query log analysis"
        - "Missing indexes identification"
        - "Query plan optimization"
        - "Connection pool tuning"
      status: "pending"
    
    - id: 1.4
      description: "Optimize identified bottlenecks"
      priority:
        - "Highest impact first"
        - "Quick wins early"
        - "Measure after each change"
      status: "pending"
    
    - id: 1.5
      description: "Implement caching strategy"
      layers:
        - "HTTP caching headers"
        - "Redis cache warming"
        - "Database query cache"
        - "CDN configuration"
      status: "pending"
    
    - id: 1.6
      description: "Frontend optimization"
      actions:
        - "Bundle size reduction"
        - "Lazy loading implementation"
        - "Image optimization"
        - "Third-party script audit"
      status: "pending"
    
    - id: 1.7
      description: "Load testing and validation"
      scenarios:
        - "Normal load"
        - "Peak load"
        - "Stress test"
        - "Soak test"
      status: "pending"

loadTesting:
  tools:
    k6:
      script: |
        import http from 'k6/http';
        import { check, sleep } from 'k6';
        
        export let options = {
          stages: [
            { duration: '5m', target: 100 },  // Ramp up
            { duration: '10m', target: 100 }, // Stay at 100
            { duration: '5m', target: 200 },  // Ramp to 200
            { duration: '10m', target: 200 }, // Stay at 200
            { duration: '5m', target: 0 },    // Ramp down
          ],
          thresholds: {
            http_req_duration: ['p(95)<200'],
            http_req_failed: ['rate<0.1'],
          },
        };
        
        export default function() {
          let response = http.get('https://api.example.com/endpoint');
          check(response, {
            'status is 200': (r) => r.status === 200,
            'response time < 200ms': (r) => r.timings.duration < 200,
          });
          sleep(1);
        }
    
    scenarios:
      smoke:
        vus: 1
        duration: "1m"
        purpose: "Sanity check"
      
      load:
        vus: 100
        duration: "30m"
        purpose: "Normal expected load"
      
      stress:
        vus: 500
        duration: "30m"
        purpose: "Beyond normal capacity"
      
      spike:
        vus: 1000
        duration: "5m"
        purpose: "Sudden traffic surge"
      
      soak:
        vus: 100
        duration: "4h"
        purpose: "Memory leaks and degradation"


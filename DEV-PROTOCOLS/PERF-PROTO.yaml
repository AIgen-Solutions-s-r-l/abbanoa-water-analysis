optimization_examples:
  n_plus_one:
    problem: |
      # Fetches users, then queries for each user's posts
      users = User.query.all()
      for user in users:
          posts = Post.query.filter_by(user_id=user.id).all()
    
    solution: |
      # Single query with join
      users = User.query.options(joinedload(User.posts)).all()
  
  slow_aggregation:
    problem: |
      SELECT COUNT(*), AVG(amount), SUM(amount)
      FROM transactions
      WHERE created_at > NOW() - INTERVAL '30 days'
      GROUP BY user_id;
    
    solution: |
      -- Add index
      CREATE INDEX idx_transactions_created_user 
      ON transactions(created_at, user_id) 
      INCLUDE (amount);
      
      -- Or use materialized view for common aggregations
      CREATE MATERIALIZED VIEW user_transaction_stats AS
      SELECT user_id, 
             COUNT(*) as tx_count,
             AVG(amount) as avg_amount,
             SUM(amount) as total_amount,
             DATE_TRUNC('day', created_at) as date
      FROM transactions
      GROUP BY user_id, DATE_TRUNC('day', created_at);
      
      CREATE INDEX ON user_transaction_stats(date, user_id);
  
  react_rerender:
    problem: |
      // Recreates object on every render
      function Component() {
        const config = { key: 'value' };
        return <ChildComponent config={config} />;
      }
    
    solution: |
      // Memoize constant values
      function Component() {
        const config = useMemo(() => ({ key: 'value' }), []);
        return <ChildComponent config={config} />;
      }


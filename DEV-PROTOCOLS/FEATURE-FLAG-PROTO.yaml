bestPractices:
  naming:
    convention: "snake_case"
    prefixes:
      - "enable_" for boolean flags
      - "experiment_" for A/B tests
      - "config_" for configuration
      - "kill_" for kill switches
    
    examples:
      good:
        - "enable_new_checkout_flow"
        - "experiment_homepage_redesign"
        - "config_api_rate_limit"
        - "kill_heavy_computation"
      
      bad:
        - "flag1"
        - "test"
        - "new_feature"
        - "tmp_flag"
  
  testing:
    unit: |
      @pytest.mark.parametrize("flag_value", [True, False])
      def test_feature_both_states(flag_value, mocker):
          mocker.patch('get_feature_flag', return_value=flag_value)
          
          result = function_under_test()
          
          if flag_value:
              assert result == "new_behavior"
          else:
              assert result == "old_behavior"
    
    integration: |
      def test_gradual_rollout():
          # Test different percentage values
          for percentage in [0, 10, 50, 100]:
              flag.update_rule(percentage=percentage)
              
              enabled_count = 0
              for user_id in range(1000):
                  if evaluate_flag('feature', {'user_id': user_id}):
                      enabled_count += 1
              
              # Allow 5% variance
              expected = (percentage / 100) * 1000
              assert abs(enabled_count - expected) < 50
  
  cleanup:
    checklist:
      - "Flag has been at 100% for > 2 weeks"
      - "No errors or issues reported"
      - "Remove flag evaluation code"
      - "Remove old code branches"
      - "Update tests"
      - "Deploy and verify"
      - "Archive flag configuration"
      - "Update documentation"
context:
  task: "Dependency management, updates, and security compliance"
  scope: ["Direct dependencies", "Transitive dependencies", "Dev dependencies"]
  languages: ["Python (Poetry)", "JavaScript (npm/yarn)", "Docker images"]
  frequency: ["Weekly security scan", "Monthly minor updates", "Quarterly major updates"]

protocol:
  managementPrinciples:
    security:
      - "Zero tolerance for critical vulnerabilities"
      - "Automated security scanning"
      - "License compliance verification"
      - "Supply chain attack prevention"
    
    stability:
      - "Lock file for reproducible builds"
      - "Semantic versioning respect"
      - "Breaking change documentation"
      - "Rollback capability"
    
    maintenance:
      - "Regular update schedule"
      - "Deprecation tracking"
      - "Unused dependency removal"
      - "Alternative evaluation"
    
    performance:
      - "Bundle size monitoring"
      - "Tree shaking optimization"
      - "Duplicate detection"
      - "Load time impact analysis"

  dependencyStrategy:
    versioning:
      pinning:
        production: "Exact versions (1.2.3)"
        development: "Minor updates (^1.2.3)"
        testing: "Patch updates (~1.2.3)"
      
      ranges:
        major: "Breaking changes, manual update"
        minor: "New features, auto-update after testing"
        patch: "Bug fixes, auto-update"
    
    categories:
      core:
        description: "Essential for application"
        updateStrategy: "Conservative, thorough testing"
        examples: ["fastapi", "react", "postgresql"]
      
      utility:
        description: "Helper libraries"
        updateStrategy: "Regular updates, moderate testing"
        examples: ["lodash", "moment", "requests"]
      
      development:
        description: "Build and test tools"
        updateStrategy: "Aggressive updates, CI validation"
        examples: ["pytest", "eslint", "webpack"]
      
      optional:
        description: "Nice-to-have features"
        updateStrategy: "Evaluate for removal"
        examples: ["analytics", "optional-ui-components"]

  implementation:
    python_poetry:
      configuration: |
        # pyproject.toml
        [tool.poetry]
        name = "water-management"
        version = "1.0.0"
        description = "Water infrastructure management system"
        authors = ["Team <team@example.com>"]
        
        [tool.poetry.dependencies]
        python = "^3.12"
        fastapi = "^0.104.0"
        sqlalchemy = "^2.0.0"
        pydantic = "^2.0.0"
        asyncpg = "^0.29.0"
        redis = "^5.0.0"
        google-cloud-bigquery = "^3.13.0"
        
        [tool.poetry.group.dev.dependencies]
        pytest = "^7.4.0"
        black = "^23.0.0"
        mypy = "^1.7.0"
        ruff = "^0.1.0"
        pytest-cov = "^4.1.0"
        
        [tool.poetry.scripts]
        check-deps = "scripts.dependency_check:main"
        update-deps = "scripts.dependency_update:main"
      
      commands: |
        # Install dependencies
        poetry install
        
        # Add new dependency
        poetry add package-name
        poetry add --group dev package-name  # Dev dependency
        
        # Update dependencies
        poetry update  # Update all within constraints
        poetry update package-name  # Update specific package
        
        # Show outdated packages
        poetry show --outdated
        
        # Export requirements
        poetry export -f requirements.txt --output requirements.txt
        
        # Dependency tree
        poetry show --tree
        
        # Check for security vulnerabilities
        poetry run safety check
        poetry run pip-audit
      
      automation: |
        import subprocess
        import json
        from typing import List, Dict, Any
        import toml
        
        class PoetryDependencyManager:
            def __init__(self, project_path: str = "."):
                self.project_path = project_path
                self.pyproject_path = f"{project_path}/pyproject.toml"
            
            def get_outdated(self) -> List[Dict[str, str]]:
                """Get list of outdated packages"""
                result = subprocess.run(
                    ["poetry", "show", "--outdated", "--format", "json"],
                    capture_output=True,
                    text=True,
                    cwd=self.project_path
                )
                
                if result.returncode == 0:
                    return json.loads(result.stdout)
                return []
            
            def check_security(self) -> Dict[str, Any]:
                """Run security checks"""
                vulnerabilities = []
                
                # Run safety check
                safety_result = subprocess.run(
                    ["poetry", "run", "safety", "check", "--json"],
                    capture_output=True,
                    text=True,
                    cwd=self.project_path
                )
                
                if safety_result.returncode != 0:
                    vulnerabilities.extend(json.loads(safety_result.stdout))
                
                # Run pip-audit
                audit_result = subprocess.run(
                    ["poetry", "run", "pip-audit", "--format", "json"],
                    capture_output=True,
                    text=True,
                    cwd=self.project_path
                )
                
                if audit_result.stdout:
                    audit_data = json.loads(audit_result.stdout)
                    vulnerabilities.extend(audit_data.get("vulnerabilities", []))
                
                return {
                    "vulnerable_packages": len(vulnerabilities),
                    "vulnerabilities": vulnerabilities
                }
            
            def update_package(self, 
                              package: str, 
                              version: str = None) -> bool:
                """Update specific package"""
                cmd = ["poetry", "add", f"{package}@{version}" if version else package]
                
                result = subprocess.run(
                    cmd,
                    capture_output=True,
                    text=True,
                    cwd=self.project_path
                )
                
                return result.returncode == 0
            
            def remove_unused(self) -> List[str]:
                """Identify unused dependencies"""
                # This would integrate with tools like deptry or import-linter
                subprocess.run(
                    ["poetry", "run", "deptry", "."],
                    cwd=self.project_path
                )
    
    javascript_npm:
      configuration: |
        // package.json
        {
          "name": "water-management-frontend",
          "version": "1.0.0",
          "scripts": {
            "audit": "npm audit",
            "audit:fix": "npm audit fix",
            "outdated": "npm outdated",
            "update:check": "npm-check-updates",
            "update:minor": "npm-check-updates -u --target minor",
            "update:patch": "npm-check-updates -u --target patch",
            "dedupe": "npm dedupe",
            "analyze": "webpack-bundle-analyzer"
          },
          "dependencies": {
            "react": "^19.0.0",
            "next": "^15.0.0",
            "tailwindcss": "^3.3.0",
            "axios": "^1.6.0"
          },
          "devDependencies": {
            "eslint": "^8.50.0",
            "jest": "^29.7.0",
            "webpack-bundle-analyzer": "^4.9.0",
            "npm-check-updates": "^16.14.0"
          },
          "overrides": {
            "vulnerable-package": "^2.0.0"
          },
          "engines": {
            "node": ">=18.0.0",
            "npm": ">=9.0.0"
          }
        }
      
      commands: |
        # Install dependencies
        npm ci  # Clean install from lock file
        npm install  # Install and update
        
        # Security audit
        npm audit
        npm audit fix  # Auto-fix vulnerabilities
        npm audit fix --force  # Force major updates
        
        # Check outdated
        npm outdated
        npx npm-check-updates  # More detailed
        
        # Update strategies
        npx npm-check-updates -u --target minor  # Update to latest minor
        npx npm-check-updates -u --target patch  # Update to latest patch
        
        # Bundle analysis
        npm run build -- --analyze
        npx bundle-buddy
        
        # Clean up
        npm dedupe  # Remove duplicates
        npm prune  # Remove unused
        
        # List dependencies
        npm list --depth=0  # Direct deps only
        npm list --prod  # Production only
      
      automation: |
        const { exec } = require('child_process');
        const fs = require('fs').promises;
        const path = require('path');
        
        class NpmDependencyManager {
          constructor(projectPath = '.') {
            this.projectPath = projectPath;
            this.packageJsonPath = path.join(projectPath, 'package.json');
          }
          
          async checkVulnerabilities() {
            return new Promise((resolve, reject) => {
              exec('npm audit --json', { cwd: this.projectPath }, 
                (error, stdout, stderr) => {
                  try {
                    const audit = JSON.parse(stdout);
                    resolve({
                      vulnerabilities: audit.metadata.vulnerabilities,
                      totalDependencies: audit.metadata.totalDependencies,
                      advisories: Object.values(audit.advisories || {})
                    });
                  } catch (e) {
                    reject(e);
                  }
                }
              );
            });
          }
          
          async getOutdated() {
            return new Promise((resolve, reject) => {
              exec('npm outdated --json', { cwd: this.projectPath },
                (error, stdout, stderr) => {
                  try {
                    const outdated = JSON.parse(stdout || '{}');
                    resolve(Object.entries(outdated).map(([name, info]) => ({
                      name,
                      current: info.current,
                      wanted: info.wanted,
                      latest: info.latest,
                      type: info.type
                    })));
                  } catch (e) {
                    reject(e);
                  }
                }
              );
            });
          }
          
          async analyzeBundleSize() {
            const stats = await fs.readFile(
              path.join(this.projectPath, '.next/build-stats.json'),
              'utf8'
            );
            
            const parsed = JSON.parse(stats);
            return {
              totalSize: parsed.totalSize,
              chunks: parsed.chunks,
              largest: parsed.chunks.sort((a, b) => b.size - a.size)[0]
            };
          }
          
          async updateDependencies(strategy = 'patch') {
            const cmd = strategy === 'major' 
              ? 'npx npm-check-updates -u'
              : `npx npm-check-updates -u --target ${strategy}`;
            
            return new Promise((resolve, reject) => {
              exec(cmd, { cwd: this.projectPath }, 
                (error, stdout, stderr) => {
                  if (error) reject(error);
                  else resolve(stdout);
                }
              );
            });
          }
        }
    
    docker:
      scanning: |
        # Dockerfile security scanning
        FROM python:3.12-slim as scanner
        
        # Install scanning tools
        RUN pip install safety bandit
        
        # Copy requirements
        COPY requirements.txt .
        
        # Run security scan
        RUN safety check -r requirements.txt
        
        # Multi-stage build for production
        FROM python:3.12-slim as production
        
        # Security best practices
        RUN useradd -m -u 1000 appuser && \
            apt-get update && \
            apt-get install -y --no-install-recommends \
                gcc \
                && rm -rf /var/lib/apt/lists/*
        
        WORKDIR /app
        
        # Copy from scanner stage (validated deps)
        COPY --from=scanner requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        
        # Switch to non-root user
        USER appuser
        
        COPY --chown=appuser:appuser . .
        
        # Health check
        HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
          CMD python -c "import requests; requests.get('http://localhost:8000/health')"
      
      image_updates: |
        #!/bin/bash
        
        # Check for base image updates
        check_base_image_updates() {
          local image=$1
          docker pull $image
          
          local current=$(docker inspect --format='{{.Id}}' $image)
          local latest=$(docker inspect --format='{{.Id}}' $image:latest)
          
          if [ "$current" != "$latest" ]; then
            echo "Update available for $image"
            return 1
          fi
          return 0
        }
        
        # Scan image for vulnerabilities
        scan_image() {
          local image=$1
          
          # Using Trivy
          trivy image --severity HIGH,CRITICAL $image
          
          # Using Snyk
          snyk container test $image
          
          # Using Docker Scout
          docker scout cves $image
        }
        
        # Update base images in Dockerfiles
        update_dockerfiles() {
          find . -name "Dockerfile*" -exec sed -i \
            's/FROM \(.*\):\(.*\)/FROM \1:latest/g' {} \;
        }

  securityScanning:
    tools:
      python:
        - name: "safety"
          command: "safety check"
          config: ".safety-policy.json"
        
        - name: "pip-audit"
          command: "pip-audit"
          autofix: "pip-audit --fix"
        
        - name: "bandit"
          command: "bandit -r src/"
          config: ".bandit"
      
      javascript:
        - name: "npm-audit"
          command: "npm audit"
          autofix: "npm audit fix"
        
        - name: "snyk"
          command: "snyk test"
          monitor: "snyk monitor"
        
        - name: "retire.js"
          command: "retire --js"
      
      container:
        - name: "trivy"
          command: "trivy image IMAGE_NAME"
          severity: "HIGH,CRITICAL"
        
        - name: "docker-scout"
          command: "docker scout cves IMAGE_NAME"
        
        - name: "grype"
          command: "grype IMAGE_NAME"
    
    policies:
      blocking:
        - "Critical vulnerabilities"
        - "High severity with known exploits"
        - "Outdated > 6 months"
        - "Unmaintained packages"
      
      warning:
        - "Medium vulnerabilities"
        - "Deprecation notices"
        - "License incompatibilities"
      
      exceptions:
        process: "Document in SECURITY.md"
        approval: "Security team review"
        timeframe: "30 days maximum"

taskPlan:
  goal: "Maintain secure and up-to-date dependencies"
  
  tasks:
    - id: 1.1
      description: "Audit current dependencies"
      checks:
        - "Security vulnerabilities"
        - "Outdated packages"
        - "Unused dependencies"
        - "License compliance"
      status: "pending"
    
    - id: 1.2
      description: "Create update strategy"
      decisions:
        - "Update frequency"
        - "Testing requirements"
        - "Rollback procedures"
      status: "pending"
    
    - id: 1.3
      description: "Implement automated scanning"
      tools:
        - "CI/CD integration"
        - "Pre-commit hooks"
        - "Scheduled scans"
      status: "pending"
    
    - id: 1.4
      description: "Update critical vulnerabilities"
      priority:
        - "Security patches"
        - "Breaking changes"
        - "Performance improvements"
      status: "pending"
    
    - id: 1.5
      description: "Optimize bundle size"
      actions:
        - "Remove unused deps"
        - "Replace heavy libraries"
        - "Enable tree shaking"
      status: "pending"
    
    - id: 1.6
      description: "Document dependency policies"
      documents:
        - "Approved package list"
        - "Update procedures"
        - "Security exceptions"
      status: "pending"
    
    - id: 1.7
      description: "Set up monitoring"
      alerts:
        - "New vulnerabilities"
        - "Deprecation warnings"
        - "License changes"
      status: "pending"

automation:
  ci_cd:
    github_actions: |
      name: Dependency Management
      
      on:
        schedule:
          - cron: '0 9 * * 1'  # Weekly on Monday
        push:
          paths:
            - 'package*.json'
            - 'poetry.lock'
            - 'requirements.txt'
      
      jobs:
        security-scan:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v3
            
            - name: Python Security Scan
              run: |
                pip install safety pip-audit
                safety check
                pip-audit
            
            - name: Node Security Scan
              run: |
                npm audit --audit-level=high
                npx snyk test
            
            - name: Container Scan
              run: |
                trivy image --severity HIGH,CRITICAL app:latest
        
        update-check:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v3
            
            - name: Check Python Updates
              run: |
                poetry show --outdated
            
            - name: Check Node Updates
              run: |
                npx npm-check-updates
            
            - name: Create Update PR
              if: steps.updates.outputs.available == 'true'
              uses: peter-evans/create-pull-request@v5
              with:
                title: 'chore(deps): update dependencies'
                body: 'Automated dependency updates'
                branch: deps/update-${{ github.run_number }}
  
  pre_commit:
    config: |
      # .pre-commit-config.yaml
      repos:
        - repo: local
          hooks:
            - id: dependency-check
              name: Check dependencies
              entry: scripts/check-deps.sh
              language: script
              files: \.(json|toml|txt|lock)$
            
            - id: security-scan
              name: Security scan
              entry: safety check
              language: system
              files: requirements\.txt$

monitoring:
  dashboards:
    - name: "Dependency Health"
      metrics:
        - "Total dependencies"
        - "Outdated count"
        - "Vulnerability count"
        - "Last update date"
    
    - name: "Security Overview"
      metrics:
        - "Critical vulnerabilities"
        - "Time to patch"
        - "Exception count"
        - "Compliance score"
  
  alerts:
    - name: "Critical Vulnerability"
      condition: "CVE score >= 9.0"
      action: "Page on-call, create incident"
    
    - name: "Multiple Outdated"
      condition: "Outdated packages > 20"
      action: "Create update task"
    
    - name: "License Violation"
      condition: "Incompatible license detected"
      action: "Block deployment, notify legal"

reports:
  monthly: |
    # Dependency Report - {month} {year}
    
    ## Summary
    - Total dependencies: {count}
    - Updated this month: {updated}
    - Security patches applied: {patches}
    - Outstanding vulnerabilities: {vulns}
    
    ## Updates Applied
    {list of updates with version changes}
    
    ## Security Status
    - Critical: {critical_count}
    - High: {high_count}
    - Medium: {medium_count}
    - Low: {low_count}
    
    ## Bundle Size Trends
    - Current: {size}
    - Change: {delta}
    - Largest deps: {top_5}
    
    ## Recommendations
    {suggested actions for next month}
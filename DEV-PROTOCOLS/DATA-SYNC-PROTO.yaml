  implementation:
    bigqueryToPostgres:
      scheduler: |
        import asyncio
        import asyncpg
        from google.cloud import bigquery
        from datetime import datetime, timedelta
        import logging
        from typing import List, Dict, Any
        
        logger = logging.getLogger(__name__)
        
        class BigQueryToPostgresSync:
            def __init__(self, 
                         bq_client: bigquery.Client,
                         pg_pool: asyncpg.Pool,
                         config: Dict[str, Any]):
                self.bq_client = bq_client
                self.pg_pool = pg_pool
                self.config = config
                self.checkpoint_table = "etl_checkpoints"
            
            async def sync_table(self, 
                                table_config: Dict[str, Any]) -> None:
                """Sync a single table from BigQuery to PostgreSQL"""
                source_table = table_config['source']
                target_table = table_config['target']
                sync_mode = table_config.get('mode', 'incremental')
                
                try:
                    # Get last checkpoint
                    last_checkpoint = await self._get_checkpoint(target_table)
                    
                    # Build query based on sync mode
                    if sync_mode == 'incremental':
                        query = self._build_incremental_query(
                            source_table, 
                            last_checkpoint,
                            table_config.get('timestamp_column', 'updated_at')
                        )
                    else:  # full sync
                        query = f"SELECT * FROM `{source_table}`"
                    
                    # Execute BigQuery query
                    logger.info(f"Executing query: {query}")
                    query_job = self.bq_client.query(query)
                    results = query_job.result()
                    
                    # Process in batches
                    batch_size = table_config.get('batch_size', 1000)
                    batch = []
                    total_rows = 0
                    
                    for row in results:
                        batch.append(dict(row))
                        
                        if len(batch) >= batch_size:
                            await self._insert_batch(target_table, batch)
                            total_rows += len(batch)
                            batch = []
                    
                    # Insert remaining rows
                    if batch:
                        await self._insert_batch(target_table, batch)
                        total_rows += len(batch)
                    
                    # Update checkpoint
                    await self._update_checkpoint(
                        target_table, 
                        datetime.utcnow()
                    )
                    
                    logger.info(f"Synced {total_rows} rows to {target_table}")
                    
                except Exception as e:
                    logger.error(f"Error syncing {source_table}: {str(e)}")
                    await self._record_error(target_table, str(e))
                    raise
            
            def _build_incremental_query(self, 
                                        table: str, 
                                        last_checkpoint: datetime,
                                        timestamp_col: str) -> str:
                """Build incremental query with checkpoint"""
                where_clause = ""
                if last_checkpoint:
                    where_clause = f"WHERE {timestamp_col} > '{last_checkpoint.isoformat()}'"
                
                return f"""
                    SELECT * 
                    FROM `{table}`
                    {where_clause}
                    ORDER BY {timestamp_col}
                """
            
            async def _insert_batch(self, 
                                  table: str, 
                                  batch: List[Dict]) -> None:
                """Insert batch of data to PostgreSQL"""
                if not batch:
                    return
                
                # Get columns from first row
                columns = list(batch[0].keys())
                
                # Build INSERT query
                placeholders = ", ".join([f"${i+1}" for i in range(len(columns))])
                query = f"""
                    INSERT INTO {table} ({', '.join(columns)})
                    VALUES ({placeholders})
                    ON CONFLICT DO UPDATE SET
                    {', '.join([f'{col} = EXCLUDED.{col}' for col in columns])}
                """
                
                # Execute batch insert
                async with self.pg_pool.acquire() as conn:
                    async with conn.transaction():
                        for row in batch:
                            values = [row[col] for col in columns]
                            await conn.execute(query, *values)
            
            async def _get_checkpoint(self, table: str) -> datetime:
                """Get last successful sync checkpoint"""
                async with self.pg_pool.acquire() as conn:
                    result = await conn.fetchrow(
                        f"""
                        SELECT last_sync_time 
                        FROM {self.checkpoint_table}
                        WHERE table_name = $1
                        """,
                        table
                    )
                    return result['last_sync_time'] if result else None
            
            async def _update_checkpoint(self, 
                                        table: str, 
                                        timestamp: datetime) -> None:
                """Update sync checkpoint"""
                async with self.pg_pool.acquire() as conn:
                    await conn.execute(
                        f"""
                        INSERT INTO {self.checkpoint_table} 
                        (table_name, last_sync_time, status)
                        VALUES ($1, $2, 'success')
                        ON CONFLICT (table_name) 
                        DO UPDATE SET 
                            last_sync_time = $2,
                            status = 'success',
                            updated_at = NOW()
                        """,
                        table, timestamp
                    )
        
        # Scheduler configuration
        class ETLScheduler:
            def __init__(self, sync_service: BigQueryToPostgresSync):
                self.sync_service = sync_service
                self.schedules = []
            
            def add_schedule(self, 
                           table_config: Dict,
                           interval: timedelta) -> None:
                """Add table to sync schedule"""
                self.schedules.append({
                    'config': table_config,
                    'interval': interval,
                    'last_run': None
                })
            
            async def run(self) -> None:
                """Run scheduler loop"""
                while True:
                    for schedule in self.schedules:
                        if self._should_run(schedule):
                            asyncio.create_task(
                                self._run_sync(schedule)
                            )
                    
                    await asyncio.sleep(60)  # Check every minute
            
            def _should_run(self, schedule: Dict) -> bool:
                """Check if sync should run"""
                if not schedule['last_run']:
                    return True
                
                elapsed = datetime.utcnow() - schedule['last_run']
                return elapsed >= schedule['interval']
            
            async def _run_sync(self, schedule: Dict) -> None:
                """Run sync for schedule"""
                try:
                    await self.sync_service.sync_table(schedule['config'])
                    schedule['last_run'] = datetime.utcnow()
                except Exception as e:
                    logger.error(f"Sync failed: {e}")
    
    dataValidation:
      checks: |
        class DataQualityChecker:
            def __init__(self, connection):
                self.conn = connection
                self.rules = []
            
            def add_rule(self, rule):
                """Add validation rule"""
                self.rules.append(rule)
            
            async def validate_completeness(self, 
                                          table: str,
                                          required_columns: List[str]):
                """Check for null values in required columns"""
                results = {}
                for column in required_columns:
                    query = f"""
                        SELECT COUNT(*) as null_count
                        FROM {table}
                        WHERE {column} IS NULL
                    """
                    result = await self.conn.fetchrow(query)
                    results[column] = result['null_count']
                
                return all(count == 0 for count in results.values())
            
            async def validate_uniqueness(self,
                                        table: str,
                                        unique_columns: List[str]):
                """Check for duplicate values"""
                columns_str = ', '.join(unique_columns)
                query = f"""
                    SELECT {columns_str}, COUNT(*) as count
                    FROM {table}
                    GROUP BY {columns_str}
                    HAVING COUNT(*) > 1
                """
                duplicates = await self.conn.fetch(query)
                return len(duplicates) == 0
            
            async def validate_referential_integrity(self,
                                                    source_table: str,
                                                    source_column: str,
                                                    ref_table: str,
                                                    ref_column: str):
                """Check foreign key integrity"""
                query = f"""
                    SELECT COUNT(*) as orphan_count
                    FROM {source_table} s
                    LEFT JOIN {ref_table} r 
                    ON s.{source_column} = r.{ref_column}
                    WHERE r.{ref_column} IS NULL
                    AND s.{source_column} IS NOT NULL
                """
                result = await self.conn.fetchrow(query)
                return result['orphan_count'] == 0
            
            async def validate_data_freshness(self,
                                            table: str,
                                            timestamp_column: str,
                                            max_age_hours: int):
                """Check data freshness"""
                query = f"""
                    SELECT MAX({timestamp_column}) as latest
                    FROM {table}
                """
                result = await self.conn.fetchrow(query)
                if result['latest']:
                    age = datetime.utcnow() - result['latest']
                    return age.total_seconds() / 3600 <= max_age_hours
                return False
            
            async def validate_anomalies(self,
                                        table: str,
                                        metric_column: str,
                                        threshold_stddev: float = 3):
                """Detect statistical anomalies"""
                query = f"""
                    WITH stats AS (
                        SELECT 
                            AVG({metric_column}) as mean,
                            STDDEV({metric_column}) as stddev
                        FROM {table}
                        WHERE {metric_column} IS NOT NULL
                    )
                    SELECT COUNT(*) as anomaly_count
                    FROM {table}, stats
                    WHERE ABS({metric_column} - stats.mean) > 
                          {threshold_stddev} * stats.stddev
                """
                result = await self.conn.fetchrow(query)
                return result['anomaly_count']

  dataTransformation:
    patterns:
      aggregation: |
        -- Time-series aggregation for water consumption
        INSERT INTO hourly_consumption (
            zone_id,
            hour,
            total_consumption,
            avg_flow_rate,
            max_pressure,
            min_pressure,
            anomaly_count
        )
        SELECT 
            zone_id,
            DATE_TRUNC('hour', timestamp) as hour,
            SUM(consumption) as total_consumption,
            AVG(flow_rate) as avg_flow_rate,
            MAX(pressure) as max_pressure,
            MIN(pressure) as min_pressure,
            COUNT(CASE WHEN is_anomaly THEN 1 END) as anomaly_count
        FROM raw_sensor_data
        WHERE timestamp >= NOW() - INTERVAL '1 hour'
        GROUP BY zone_id, DATE_TRUNC('hour', timestamp)
        ON CONFLICT (zone_id, hour) 
        DO UPDATE SET
            total_consumption = EXCLUDED.total_consumption,
            avg_flow_rate = EXCLUDED.avg_flow_rate,
            updated_at = NOW();
      
      denormalization: |
        -- Denormalize for query performance
        CREATE MATERIALIZED VIEW user_consumption_summary AS
        SELECT 
            u.user_id,
            u.name,
            u.zone_id,
            z.zone_name,
            SUM(c.amount) as total_consumption_30d,
            AVG(c.amount) as avg_daily_consumption,
            COUNT(DISTINCT DATE(c.timestamp)) as active_days,
            MAX(c.timestamp) as last_reading
        FROM users u
        JOIN zones z ON u.zone_id = z.zone_id
        LEFT JOIN consumption c ON u.user_id = c.user_id 
            AND c.timestamp >= NOW() - INTERVAL '30 days'
        GROUP BY u.user_id, u.name, u.zone_id, z.zone_name;
        
        -- Refresh strategy
        CREATE OR REPLACE FUNCTION refresh_consumption_summary()
        RETURNS void AS $$
        BEGIN
            REFRESH MATERIALIZED VIEW CONCURRENTLY user_consumption_summary;
        END;
        $$ LANGUAGE plpgsql;
        
        -- Schedule refresh
        SELECT cron.schedule('refresh-consumption', '0 * * * *', 
            'SELECT refresh_consumption_summary()');
      
      eventSourcing: |
        -- Event-driven updates
        CREATE TABLE water_events (
            event_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            event_type VARCHAR(50) NOT NULL,
            entity_id VARCHAR(100) NOT NULL,
            entity_type VARCHAR(50) NOT NULL,
            event_data JSONB NOT NULL,
            created_at TIMESTAMP DEFAULT NOW(),
            processed_at TIMESTAMP
        );
        
        -- Process events
        CREATE OR REPLACE FUNCTION process_water_events()
        RETURNS void AS $$
        DECLARE
            event RECORD;
        BEGIN
            FOR event IN 
                SELECT * FROM water_events 
                WHERE processed_at IS NULL 
                ORDER BY created_at
                LIMIT 1000
            LOOP
                CASE event.event_type
                    WHEN 'consumption_reading' THEN
                        PERFORM process_consumption_event(event);
                    WHEN 'pressure_alert' THEN
                        PERFORM process_pressure_alert(event);
                    WHEN 'maintenance_scheduled' THEN
                        PERFORM process_maintenance_event(event);
                END CASE;
                
                UPDATE water_events 
                SET processed_at = NOW() 
                WHERE event_id = event.event_id;
            END LOOP;
        END;
        $$ LANGUAGE plpgsql;


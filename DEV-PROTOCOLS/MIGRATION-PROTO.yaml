context:
  task: "Database schema migration and data transformation"
  types: ["Schema change", "Data migration", "Index optimization", "Database upgrade"]
  strategy: "Zero-downtime deployment with rollback capability"

protocol:
  migrationPrinciples:
    safety:
      - "Always backup before migration"
      - "Test in staging environment first"
      - "Prepare rollback scripts"
      - "Monitor during and after migration"
    
    compatibility:
      - "Maintain backward compatibility"
      - "Use feature flags for new schemas"
      - "Gradual migration for large datasets"
      - "Dual-write during transition"
    
    performance:
      - "Run during low-traffic periods"
      - "Batch large data updates"
      - "Create indexes CONCURRENTLY"
      - "VACUUM and ANALYZE after migration"

  migrationTypes:
    schemaChanges:
      addColumn:
        safe: true
        pattern: |
          -- Add column with default (PostgreSQL)
          ALTER TABLE users 
          ADD COLUMN created_at TIMESTAMP DEFAULT NOW();
          
          -- For existing rows without blocking
          ALTER TABLE users 
          ADD COLUMN status VARCHAR(50);
          
          UPDATE users 
          SET status = 'active' 
          WHERE status IS NULL
          LIMIT 1000;  -- Batch updates
        
        rollback: |
          ALTER TABLE users DROP COLUMN created_at;
      
      dropColumn:
        safe: false  # Application must stop using it first
        pattern: |
          -- Phase 1: Stop using column in code
          -- Phase 2: Deploy code
          -- Phase 3: Drop column
          ALTER TABLE users DROP COLUMN deprecated_field;
        
        rollback: |
          -- Must restore from backup or recreate with data
      
      renameColumn:
        safe: false  # Requires dual-read period
        pattern: |
          -- Phase 1: Add new column
          ALTER TABLE users ADD COLUMN email_address VARCHAR(255);
          
          -- Phase 2: Dual-write in application
          -- Write to both old_email and email_address
          
          -- Phase 3: Copy data
          UPDATE users SET email_address = old_email 
          WHERE email_address IS NULL;
          
          -- Phase 4: Switch reads to new column
          -- Phase 5: Stop writing to old column
          -- Phase 6: Drop old column
          ALTER TABLE users DROP COLUMN old_email;
      
      changeColumnType:
        safe: "Depends on conversion"
        pattern: |
          -- Safe expansion (e.g., VARCHAR(50) to VARCHAR(100))
          ALTER TABLE users 
          ALTER COLUMN name TYPE VARCHAR(100);
          
          -- Unsafe (requires new column approach)
          -- Don't do: ALTER COLUMN age TYPE INTEGER;
          -- Instead: Create new column, migrate data, drop old
    
    indexManagement:
      createIndex:
        pattern: |
          -- Non-blocking index creation
          CREATE INDEX CONCURRENTLY idx_users_email 
          ON users(email);
          
          -- Partial index for performance
          CREATE INDEX CONCURRENTLY idx_orders_pending
          ON orders(created_at)
          WHERE status = 'pending';
          
          -- Composite index for queries
          CREATE INDEX CONCURRENTLY idx_user_activity
          ON activities(user_id, created_at DESC);
        
        monitoring: |
          -- Check index usage
          SELECT schemaname, tablename, indexname, idx_scan
          FROM pg_stat_user_indexes
          ORDER BY idx_scan;
      
      dropIndex:
        pattern: |
          DROP INDEX CONCURRENTLY idx_old_index;
        
        validation: "Ensure index not used by queries"
      
      reindex:
        pattern: |
          -- Online reindex (PostgreSQL 12+)
          REINDEX INDEX CONCURRENTLY idx_name;
          
          -- Or create new and swap
          CREATE INDEX CONCURRENTLY idx_new ON table(column);
          DROP INDEX CONCURRENTLY idx_old;
          ALTER INDEX idx_new RENAME TO idx_old;
    
    dataTransformation:
      bulkUpdate:
        pattern: |
          -- Batch updates to avoid locking
          DO $$
          DECLARE
            batch_size INTEGER := 1000;
            offset_val INTEGER := 0;
            total_rows INTEGER;
          BEGIN
            SELECT COUNT(*) INTO total_rows FROM users WHERE condition;
            
            WHILE offset_val < total_rows LOOP
              UPDATE users 
              SET field = new_value
              WHERE id IN (
                SELECT id FROM users 
                WHERE condition
                LIMIT batch_size
                OFFSET offset_val
              );
              
              offset_val := offset_val + batch_size;
              PERFORM pg_sleep(0.1); -- Brief pause between batches
            END LOOP;
          END $$;
      
      dataBackfill:
        pattern: |
          -- Populate new column from existing data
          UPDATE users
          SET full_name = first_name || ' ' || last_name
          WHERE full_name IS NULL
          AND created_at < '2024-01-01'; -- Process historical data
      
      denormalization:
        pattern: |
          -- Add denormalized counter
          ALTER TABLE posts ADD COLUMN comment_count INTEGER DEFAULT 0;
          
          -- Backfill from normalized data
          UPDATE posts p
          SET comment_count = (
            SELECT COUNT(*) 
            FROM comments c 
            WHERE c.post_id = p.id
          );
          
          -- Add trigger to maintain
          CREATE TRIGGER update_comment_count
          AFTER INSERT OR DELETE ON comments
          FOR EACH ROW
          EXECUTE FUNCTION update_post_comment_count();

  versionControl:
    tools:
      alembic:  # Python/SQLAlchemy
        init: "alembic init migrations"
        create: "alembic revision --autogenerate -m 'description'"
        apply: "alembic upgrade head"
        rollback: "alembic downgrade -1"
      
      flyway:  # Java/General
        config: "flyway.conf"
        naming: "V{version}__{description}.sql"
        migrate: "flyway migrate"
        undo: "flyway undo"
      
      djangoMigrations:  # Django
        create: "python manage.py makemigrations"
        apply: "python manage.py migrate"
        rollback: "python manage.py migrate app_name {previous_version}"
    
    naming:
      format: "{version}_{timestamp}_{description}.sql"
      examples:
        - "001_20240101120000_add_user_table.sql"
        - "002_20240102093000_add_email_index.sql"
        - "003_20240103143000_migrate_legacy_data.sql"
    
    structure:
      directories:
        - "migrations/up/"    # Forward migrations
        - "migrations/down/"  # Rollback scripts
        - "migrations/seed/"  # Test data
        - "migrations/docs/"  # Migration documentation

taskPlan:
  goal: "Execute database migration safely with zero downtime"
  
  tasks:
    - id: 1.1
      description: "Pre-migration analysis"
      checks:
        - "Review migration scripts"
        - "Estimate execution time"
        - "Check disk space"
        - "Identify dependencies"
      status: "pending"
    
    - id: 1.2
      description: "Create backup"
      commands:
        - "pg_dump -h localhost -U user -d database > backup_{timestamp}.sql"
        - "Verify backup integrity"
        - "Store in secure location"
      status: "pending"
    
    - id: 1.3
      description: "Test migration in staging"
      steps:
        - "Restore production data to staging"
        - "Run migration scripts"
        - "Validate data integrity"
        - "Performance testing"
      status: "pending"
    
    - id: 1.4
      description: "Prepare rollback plan"
      artifacts:
        - "Rollback scripts"
        - "Backup restoration procedure"
        - "Monitoring queries"
        - "Success criteria"
      status: "pending"
    
    - id: 1.5
      description: "Execute migration"
      phases:
        - "Enable maintenance mode (if needed)"
        - "Run pre-migration checks"
        - "Execute migration scripts"
        - "Validate migration success"
      status: "pending"
    
    - id: 1.6
      description: "Post-migration validation"
      checks:
        - "Data integrity verification"
        - "Application functionality"
        - "Performance benchmarks"
        - "Error monitoring"
      status: "pending"
    
    - id: 1.7
      description: "Cleanup and optimization"
      tasks:
        - "Remove old columns/tables"
        - "VACUUM and ANALYZE"
        - "Update statistics"
        - "Document changes"
      status: "pending"

validation:
  preMigration:
    - check: "Schema compatibility"
      query: |
        SELECT version();
        SHOW server_version;
    
    - check: "Disk space available"
      query: |
        SELECT pg_database_size(current_database());
    
    - check: "Active connections"
      query: |
        SELECT count(*) FROM pg_stat_activity;
    
    - check: "Long-running queries"
      query: |
        SELECT pid, now() - pg_stat_activity.query_start AS duration, query
        FROM pg_stat_activity
        WHERE (now() - pg_stat_activity.query_start) > interval '5 minutes';
  
  postMigration:
    - check: "Table structure"
      query: |
        SELECT column_name, data_type, is_nullable
        FROM information_schema.columns
        WHERE table_name = 'target_table';
    
    - check: "Row counts"
      query: |
        SELECT 
          (SELECT COUNT(*) FROM table_before) as before_count,
          (SELECT COUNT(*) FROM table_after) as after_count;
    
    - check: "Data integrity"
      query: |
        -- Custom validation queries
        SELECT COUNT(*) FROM users WHERE email IS NULL;
        SELECT COUNT(*) FROM orders WHERE user_id NOT IN (SELECT id FROM users);
    
    - check: "Index usage"
      query: |
        SELECT indexrelname, idx_scan, idx_tup_read, idx_tup_fetch
        FROM pg_stat_user_indexes
        WHERE schemaname = 'public';

rollback:
  decision_criteria:
    - "Migration script fails"
    - "Data corruption detected"
    - "Application errors > threshold"
    - "Performance degradation > 50%"
  
  procedure:
    immediate:
      - "Stop migration if in progress"
      - "Assess current state"
      - "Execute rollback scripts"
    
    fromBackup:
      - "Stop application"
      - "Drop corrupted database"
      - "Restore from backup"
      - "Replay transactions if possible"
  
  communication:
    - "Notify stakeholders"
    - "Update status page"
    - "Document lessons learned"

monitoring:
  during:
    - metric: "Query execution time"
      alert: "> 30 seconds"
    
    - metric: "Lock wait time"
      alert: "> 10 seconds"
    
    - metric: "Replication lag"
      alert: "> 60 seconds"
    
    - metric: "Disk I/O"
      alert: "> 90% utilization"
  
  after:
    duration: "24 hours intensive monitoring"
    metrics:
      - "Application error rate"
      - "Database performance"
      - "Query patterns"
      - "Resource utilization"

documentation:
  template: |
    # Migration: {title}
    Date: {date}
    Author: {author}
    
    ## Summary
    {brief description of changes}
    
    ## Changes
    - {list of schema changes}
    - {data transformations}
    
    ## Rollback Plan
    {rollback procedure}
    
    ## Testing
    - Staging: {test results}
    - Production validation: {criteria}
    
    ## Risks
    - {identified risks}
    - {mitigation strategies}
    
    ## Timeline
    - Start: {time}
    - End: {time}
    - Duration: {duration}
    
    ## Post-Migration
    - {cleanup tasks}
    - {monitoring period}
  
  location: "migrations/docs/{version}_{date}.md"
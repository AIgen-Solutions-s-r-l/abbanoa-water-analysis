[pytest]
# Configuration for error scenario tests

# Markers for organizing error tests
markers =
    error_4xx: Tests for 4xx client errors
    error_5xx: Tests for 5xx server errors
    error_400: Bad request scenarios
    error_404: Not found scenarios
    error_422: Validation error scenarios
    error_500: Internal server error scenarios
    error_auth: Authentication/authorization errors
    error_timeout: Timeout and slow response scenarios
    error_cascade: Cascading failure scenarios

# Test discovery
python_files = test_error_*.py
python_classes = Test*
python_functions = test_*

# Timeout for error tests (shorter since we expect failures)
timeout = 10

# Output options
addopts = 
    --strict-markers
    --tb=short
    -v
    --color=yes

# Coverage for error paths
coverage:run:
    source = src/presentation/api/endpoints
    omit = */tests/*

# Parallel execution for faster CI
workers = 4